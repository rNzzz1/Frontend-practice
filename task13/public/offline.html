<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Офлайн</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Trebuchet MS", sans-serif;
        background: linear-gradient(180deg, #f4f2ea, #ecf1f4);
        color: #1d2731;
      }

      article {
        width: min(100%, 520px);
        padding: 24px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #d8d2c6;
        box-shadow: 0 18px 36px rgba(30, 45, 60, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-family: Georgia, serif;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: #5a6875;
      }
    </style>
  </head>
  <body>
    <article>
      <h1>Вы офлайн</h1>
      <p>
        Основная страница приложения уже должна открываться из кэша. Если браузер
        попал сюда, значит нужный ресурс не был найден в кеше.
      </p>
    </article>
  </body>
</html>
