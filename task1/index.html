<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Практика 1 — Карточка товара</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <main>
    <article class="product-card">
      <img
        class="product-card__image"
        src="./img/keyboard.png"
        alt="Фото товара"
      />

      <div class="product-card__content">
        <h2 class="product-card__title">Механическая клавиатура</h2>

        <p class="product-card__desc">
          Компактная 75%, горячая замена переключателей (hot-swap), подсветка и алюминиевый корпус.
        </p>

        <div class="product-card__price">16&nbsp;999 ₽</div>

        <a class="btn" href="#">Купить</a>
      </div>
    </article>
  </main>
</body>
</html>
