<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление товарами - API</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 Управление товарами</h1>
            <p class="subtitle">Практическая работа №2 - CRUD API</p>
        </header>

        <main>
            <!-- Форма добавления товара -->
            <section class="add-section">
                <h2>Добавить товар</h2>
                <form id="addProductForm">
                    <div class="form-group">
                        <label for="productName">Название:</label>
                        <input type="text" id="productName" placeholder="Введите название товара" required>
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Цена (₽):</label>
                        <input type="number" id="productPrice" placeholder="Введите цену" step="0.01" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Добавить товар</button>
                </form>
            </section>

            <!-- Список товаров -->
            <section class="products-section">
                <div class="section-header">
                    <h2>Список товаров</h2>
                    <button id="refreshBtn" class="btn btn-secondary">🔄 Обновить</button>
                </div>
                <div id="productsList" class="products-list">
                    <!-- Товары будут загружены через JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <!-- Модальное окно редактирования -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Редактировать товар</h2>
            <form id="editProductForm">
                <input type="hidden" id="editProductId">
                <div class="form-group">
                    <label for="editProductName">Название:</label>
                    <input type="text" id="editProductName" required>
                </div>
                <div class="form-group">
                    <label for="editProductPrice">Цена (₽):</label>
                    <input type="number" id="editProductPrice" step="0.01" required>
                </div>
                <button type="submit" class="btn btn-primary">Сохранить изменения</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
