<section class="page-block">
  <div class="page-head">
    <h2>Заметки и напоминания</h2>
    <p>
      Практика 17: добавлены push-напоминания через <code>Service Worker</code>.
      Можно создать обычную заметку или заметку с датой и временем.
    </p>
  </div>

  <div class="actions-row">
    <button id="enablePushBtn" class="btn" type="button">Включить Push</button>
    <button id="disablePushBtn" class="btn ghost" type="button">Отключить Push</button>
    <button id="testPushBtn" class="btn ghost" type="button">Тест Push</button>
    <button id="clearNotesBtn" class="btn ghost" type="button">Очистить заметки</button>
  </div>

  <p id="pushHint" class="hint-text">Сначала включите Push-уведомления.</p>

  <form id="note-form" class="note-form">
    <label class="field">
      <span>Текст заметки</span>
      <input
        id="note-input"
        type="text"
        maxlength="140"
        placeholder="Введите текст заметки"
        required
      />
    </label>

    <div class="actions-row">
      <button class="btn" type="submit">Добавить заметку</button>
    </div>
  </form>

  <form id="reminder-form" class="note-form reminder-form">
    <label class="field">
      <span>Текст напоминания</span>
      <input
        id="reminder-text"
        type="text"
        maxlength="140"
        placeholder="Например, созвон с командой"
        required
      />
    </label>

    <label class="field">
      <span>Дата и время напоминания</span>
      <input id="reminder-time" type="datetime-local" required />
    </label>

    <div class="actions-row">
      <button class="btn" type="submit">Добавить с напоминанием</button>
    </div>
  </form>

  <p id="formMessage" class="form-message" aria-live="polite"></p>

  <div class="split-grid">
    <section>
      <h3 class="section-title">Список заметок</h3>
      <div id="notes-list" class="notes-list"></div>
    </section>

    <section>
      <h3 class="section-title">События</h3>
      <div id="eventsList" class="events-list">
        <article class="empty-card">Пока событий нет.</article>
      </div>
    </section>
  </div>
</section>
