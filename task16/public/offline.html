<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Офлайн</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f6f2eb, #e9f1f4);
        font-family: "Trebuchet MS", sans-serif;
        color: #1b2936;
      }

      article {
        width: min(100%, 520px);
        padding: 24px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid #d7d0c4;
      }

      h1 {
        margin: 0 0 10px;
        font-family: Georgia, serif;
      }

      p {
        margin: 0;
        color: #5b6b78;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <article>
      <h1>Офлайн-страница</h1>
      <p>Сеть недоступна. После первого запуска shell и страницы кэшируются, поэтому приложение продолжает работать.</p>
    </article>
  </body>
</html>
